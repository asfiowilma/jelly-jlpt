<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https: http://localhost:5984 http://127.0.0.1:5984;">
<title>日本語 N5–N1 Course</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<!-- PouchDB 9.0.0: local IndexedDB store for synced learning data (store.js) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pouchdb/9.0.0/pouchdb.min.js" integrity="sha512-hyVHTpOcRgAUXkchpu2278X+cGfyHDm7mVx8iUu9/jFjF2okiD4hWiDPQFhzQN9x788LJfU/9xcaDPz2nwYLDQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<link rel="stylesheet" href="styles.css">
<!-- Apply saved theme before first paint (no flash). Unknown values fall back to styles.css's bare :root (Aizome dark); App normalizes + re-saves them. -->
<script>try{document.documentElement.setAttribute('data-palette',localStorage.getItem('jlpt_palette')||'ai');document.documentElement.setAttribute('data-theme',localStorage.getItem('jlpt_theme')||'dark')}catch(e){}</script>

</head>
<body>
<div id="root"></div>
<!--
  Load order matters — no bundler resolves this automatically:
  1. data/catalog.js (declares CATALOG { items, add } + PLAN = [])
  2. data/<level>/*.js (CATALOG.add([...]) item files + plan.js PLAN.push(...); any order)
  3. lib.js (pure helpers + Babel runtime helpers; reads CATALOG/PLAN only when called)
  4. store.js (Store: PouchDB-backed persistence for synced learning data; uses lib.js)
  5. app-helpers.js (t/tRuby/speak/icons/stroke-order fetch; uses lib.js levelRank)
     sfx.js (playSfx/sfxMuted: quiz + achievement sounds from sfx/)
  6. components/*.js (any order — only read data/helpers inside render, not at load time)
  7. app.js (builds UNITS from PLAN + CATALOG, awaits Store.init(), then mounts React)
  legacy/curriculum/ is the old day-based content, kept as a salvage quarry only — not loaded.
-->
<script src="data/catalog.js"></script>
<script src="data/n5/grammar.js"></script>
<script src="data/n5/kana.js"></script>
<script src="data/n5/kanji.js"></script>
<script src="data/n5/mondai.js"></script>
<script src="data/n5/plan.js"></script>
<script src="data/n5/sentences.js"></script>
<script src="data/n5/vocab.js"></script>
<script src="lib.js"></script>
<script src="store.js"></script>
<script src="app-helpers.js"></script>
<script src="sfx.js"></script>
<script src="components/char-card.js"></script>
<script src="components/kanji-section.js"></script>
<script src="components/exercises.js"></script>
<script src="components/unit-view.js"></script>
<script src="components/review-mode.js"></script>
<script src="components/overview.js"></script>
<script src="components/stats-view.js"></script>
<script src="components/settings-view.js"></script>
<script src="app.js"></script>
</body>
</html>
