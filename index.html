<div id="root"></div>
<!--
  Load order matters — no bundler resolves this automatically:
  1. curriculum/00-constants.js (declares `curriculum = []` + PHASE_COLORS/PHASE_BG/PHASE_NAMES)
  2. curriculum/01..32 (each appends its phase's days via curriculum.push())
  3. lib.js (pure helpers + Babel runtime helpers, no top-level curriculum reads)
  4. app-helpers.js (t/lsLoad/lsSave/speak/..., reads PHASE_COLORS at load time)
  5. components/*.js (any order — only read curriculum/helpers inside render, not at load time)
  6. app.js (mounts React — the only script that actually renders the tree)
-->
